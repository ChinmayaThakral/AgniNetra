name: live

# Checks AgniNetra Live on every push to its branch. The app runs on the owner's server
# from the Dockerfile and rebuilds its own feed through the evening, D140, so nothing here
# needs a secret or publishes anything.

on:
  push:
    branches: [agninetra]
  pull_request:
    branches: [agninetra]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.11
      - run: uv pip install -c requirements.lock.txt -r pyproject.toml --extra dev
      - run: uv pip check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python scripts/check_conventions.py
      - run: uv run --no-sync pytest

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.11 --seed .venv-runtime
      - run: >-
          .venv-runtime/bin/python -m pip install -c requirements.lock.txt
          duckdb h5py matplotlib numpy pillow python-dotenv requests
      - run: .venv-runtime/bin/python -m pip check
      - run: >-
          .venv-runtime/bin/python -c
          "import duckdb, h5py, matplotlib, numpy, PIL, dotenv, requests;
          from PIL import features; assert features.check('webp')"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/live/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/live/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
