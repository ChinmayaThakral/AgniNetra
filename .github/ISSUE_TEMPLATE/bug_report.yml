name: Bug report
description: Something in the console, Live or the pipeline does not work as it should.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - AgniNetra Live
        - Research console
        - Pipeline or scripts
        - Data or documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: input
    id: device
    attributes:
      label: Browser and device, if it is a web app
