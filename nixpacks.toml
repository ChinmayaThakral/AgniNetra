providers = []

[phases.setup]
nixPkgs = ["nodejs_22"]
nixpkgsArchive = "e6f23dc08d3624daab7094b701aa3954923c6bbb"

[phases.install]
cmds = ["cd apps/console && npm ci --include=dev"]
cacheDirectories = ["/root/.npm"]

[phases.build]
cmds = ["cd apps/console && npm run build"]

[start]
cmd = "cd apps/console && npm start"
